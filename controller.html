            background-size: cover;
            color: var(--cream); font-family: Georgia, 'Times New Roman', serif;
            text-align: center; margin: 0; padding: 14px 10px 40px; min-height: 100vh;
        }
        h2.title { font-size: 34px; letter-spacing: 2px; margin: 14px 0 10px; text-shadow: 0 2px 0 #14241e; }
        h3 { letter-spacing: 1px; }
        input, button { font-family: Georgia, serif; }
        input {
            padding: 14px; font-size: 20px; border-radius: 10px; width: 92%; max-width: 420px;
            background: #5f3220; color: var(--cream); border: 2px solid var(--cream); outline: none;
        }
        input::placeholder { color: #e5d5b8; }
        .btn {
            padding: 15px; font-size: 20px; border-radius: 12px; margin: 10px; border: none;
            background: #00b4d8; color: white; cursor: pointer; font-weight: bold;
            width: 85%; max-width: 340px; letter-spacing: 1px;
        }
        .btn:active { transform: scale(0.96); }
        .panel {
            background: var(--panel); color: var(--ink); border: 6px solid var(--frame);
            border-radius: 14px; box-shadow: 0 8px 22px rgba(0,0,0,.5), inset 0 0 0 2px #d8cbaa;
            padding: 14px 12px 18px; max-width: 440px; margin: 14px auto 0;
        }
        .panel h3 { margin: 4px 0 10px; color: var(--ink); }
        .belt-btn {
            background: linear-gradient(#4d3320, #3a2517); color: var(--cream);
            border: 4px solid var(--gold); border-radius: 24px; padding: 16px 34px;
            font-size: 22px; font-weight: bold; letter-spacing: 2px; cursor: pointer;
            box-shadow: 0 6px 16px rgba(0,0,0,.5), inset 0 0 0 2px #6b4a2e;
        }
        .belt-btn:active { transform: scale(0.96); }
        .lang-btn { position: fixed; top: 12px; right: 12px; z-index: 60; padding: 10px 18px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; background: #5f3220; color: var(--cream); border: 3px solid #c9a227; font-family: Georgia, serif; }

        /* ── mask designer ── */
        #maskRow { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: nowrap; }
        .mask-option { width: 44px; cursor: pointer; border-radius: 10px; padding: 3px; border: 3px solid transparent; }
        .mask-option.selected { border-color: var(--gold); background: rgba(201,162,39,.15); }
        #maskPreview svg { filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
        .cfg-row {
            display: flex; align-items: center; justify-content: space-between;
            background: #5f3220; color: var(--cream); border-radius: 10px;
            padding: 8px 12px; margin: 8px auto; max-width: 320px;
        }
        .cfg-row span { font-size: 17px; letter-spacing: 1px; }
        .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--cream); cursor: pointer; }
        #patternRow { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
        .pattern-chip {
            padding: 7px 10px; font-size: 13px; border-radius: 9px; cursor: pointer;
            background: #5f3220; color: var(--cream); border: 2px solid #7a4a30; letter-spacing: 1px;
        }
        .pattern-chip.selected { border-color: var(--gold); color: var(--gold); }
        #palette {
            display: none; position: fixed; left: 50%; transform: translateX(-50%);
            bottom: 24px; background: #fff; border-radius: 12px; padding: 10px;
            grid-template-columns: repeat(6, 34px); gap: 7px; z-index: 50;
            box-shadow: 0 8px 26px rgba(0,0,0,.6);
        }
        #palette div { width: 34px; height: 34px; border-radius: 6px; cursor: pointer; border: 2px solid #ddd; }
        .player-name-display { font-size: 24px; color: #cc5c33; margin-bottom: 14px; letter-spacing: 1px; text-shadow: 0 2px 0 rgba(20,14,8,.55), 0 0 10px rgba(0,0,0,.35); }
        .player-name-display svg { vertical-align: middle; margin-right: 8px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
        .vote-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .mini-mask { width: 38px; height: auto; border-radius: 10px; vertical-align: middle; box-shadow: 0 2px 5px rgba(0,0,0,.4); }
        h2 .mini-mask { margin-right: 10px; }
        #waitingMessage { font-size: 22px; font-weight: bold; color: #ffd166; margin-top: 20px; letter-spacing: 1px; }
        #notice { display: none; font-size: 21px; font-weight: bold; color: #ffd166; margin: 12px 0 4px; letter-spacing: 1px; text-shadow: 0 2px 0 #14241e; }
        .meme-display.chale { background: #30343b; }
        .meme-display.chale img { width: 58%; margin: 20% auto; border: none; background: transparent; }

        .meme-option { width: 80%; max-width: 250px; border: 4px solid transparent; border-radius: 10px; cursor: pointer; margin-bottom: 15px; transition: 0.2s;}
        .meme-display { position: relative; display: inline-block; width: 80%; max-width: 300px; margin-bottom: 15px; }
        .meme-display img { width: 100%; border-radius: 10px; border: 3px solid #00b4d8; display: block; }
        .meme-text {
            position: absolute; width: 100%; text-align: center; color: white;
            font-family: 'Impact', sans-serif; font-size: 26px; text-transform: uppercase;
            text-shadow: 2px 0 0 #000, -2px 0 0 #000, 0 2px 0 #000, 0 -2px 0 #000,
                         2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000,
                         1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            left: 0; padding: 0 10px; box-sizing: border-box; word-wrap: break-word; pointer-events: none;
        }
        .meme-top { top: 10px; }
        .meme-bottom { bottom: 10px; }
    </style>
</head>
<body>

    <div id="setupScreen">
        <h2 class="title" id="joinTitle">JOIN THE GAME</h2>
        <button id="langBtn" class="lang-btn" onclick="toggleLang()">EN</button>
        <input type="text" id="nameInput" placeholder="YOUR NICKNAME" maxlength="24">
        <div class="panel">
            <h3 id="designTitle">DESIGN YOUR LUCHADOR</h3>
            <h3 id="selectMaskTitle" style="font-size:15px; opacity:.85;">SELECT MASK</h3>
            <div id="maskRow"></div>
            <div id="maskPreview" style="margin: 6px 0 2px;"></div>
            <div class="cfg-row"><span id="lblBase">BASE COLOR</span><div class="swatch" id="sw-c1" onclick="openPalette(0)"></div></div>
            <div class="cfg-row"><span id="lblAcc1">ACCENT 1</span><div class="swatch" id="sw-c2" onclick="openPalette(1)"></div></div>
            <div class="cfg-row"><span id="lblAcc2">ACCENT 2</span><div class="swatch" id="sw-c3" onclick="openPalette(2)"></div></div>
            <div class="cfg-row"><span id="lblAcc3">ACCENT 3</span><div class="swatch" id="sw-c4" onclick="openPalette(3)"></div></div>
        </div>
        <button id="connectBtn" class="btn" onclick="connectToServer()">JOIN</button>
        <div id="palette"></div>
    </div>

    <div id="gameScreen" style="display: none;">
        <div class="player-name-display" id="playerNameDisplay"></div>
        <div id="notice" style="display: none;"></div>
        <div id="waitingMessage">Waiting for Host...</div>

        <div id="imageScreen" style="display: none;">
            <h3 id="pickTitle">Pick your template!</h3>
            <div id="imageChoices"></div>
        </div>

        <div id="captionScreen" style="display: none;">
            <h3 id="writeTitle">Write your best joke!</h3>
            <img id="captionImage" src="" style="width: 80%; max-width: 250px; border-radius: 10px; margin-bottom: 10px;">
            <br><input type="text" id="topTextInput" placeholder="TOP TEXT" maxlength="30" style="width: 80%;">
            <br><input type="text" id="bottomTextInput" placeholder="BOTTOM TEXT" maxlength="30" style="width: 80%;">
            <br><button id="finishBtn" class="btn" onclick="submitMeme()">FINISH</button>
        </div>

        // Small mask avatar for a player name; updates itself later if the
        // mask arrives after the screen was already built.
        function maskAvatar(name) {
            let img = document.createElement("img");
            img.className = "mini-mask";
            img.dataset.maskfor = name;
            if (maskByName[name]) img.src = maskByName[name];
            return img;
        }

        // Fills the template picker with `count` different random images.
        // Called on every NEW_ROUND so players get fresh choices each time.
        function showRandomTemplates(count) {
            let choices = [];
            while (choices.length < count) {
                let n = Math.floor(Math.random() * IMAGE_COUNT) + 1;
                if (!choices.includes(n)) choices.push(n);
            }
            let box = document.getElementById("imageChoices");
            box.innerHTML = "";
            choices.forEach(n => {
                let img = document.createElement("img");
                img.src = IMAGE_BASE_URL + n + IMAGE_EXT;
                img.className = "meme-option";
                img.onclick = () => pickImage(img.src);
                box.appendChild(img);
            });
        }

        // Builds a meme card safely: caption text goes in via textContent,
        // so players can't break the screen by typing < or " in their jokes.
        // When there is no image (player didn't submit), show their mask.
        function makeMemeCard(imgUrl, topText, bottomText, name) {
            let card = document.createElement("div");
            card.className = "meme-display";
            let img = document.createElement("img");
            if (!imgUrl && name && maskByName[name]) {
                img.src = maskByName[name];
                card.classList.add("chale");
            } else {
                img.src = imgUrl;
            }
            let top = document.createElement("div");
            top.className = "meme-text meme-top";
            top.textContent = topText;
            let bottom = document.createElement("div");
            bottom.className = "meme-text meme-bottom";
            bottom.textContent = bottomText;
            card.appendChild(img);
            card.appendChild(top);
            card.appendChild(bottom);
            return card;
        }

            btn.style.marginTop = "0";

4 3.1-11.5l0.8-1.1 5.3-2.8 2.9-4.4c-2.5 1.4-6.1 2.7-9.6 3.4z\" fill=\"url(#SVGID_1_)\"/>\n</svg>"}];
        const PALETTE = ["#e53935", "#ef6c00", "#f9c80e", "#cddc39", "#2e7d32", "#00897b", "#00acc1", "#1e5aa8", "#6a4c93", "#ad1457", "#f2e8c9", "#d9a441", "#9e9e9e", "#4a3527", "#101010", "#ffffff", "#7cb342", "#5d4037"];
        const COLOR_LABELS = ["BASE COLOR", "ACCENT 1", "ACCENT 2", "ACCENT 3"];
        // default design = the green classic, like the lobby mockup
        let maskCfg = { mask: 0, colors: MASK_ART[0].defaults.slice() };
        let paletteTarget = 0;
        let svgId = 0;

        function hexToHsl(hex) {
            hex = hex.replace("#", "");
            let r = parseInt(hex.slice(0, 2), 16) / 255, g = parseInt(hex.slice(2, 4), 16) / 255, b = parseInt(hex.slice(4, 6), 16) / 255;
            const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
            let h = 0;
            if (d > 0) {
                if (mx === r) h = ((g - b) / d) % 6;
                else if (mx === g) h = (b - r) / d + 2;
                else h = (r - g) / d + 4;
                h = Math.round(h * 60); if (h < 0) h += 360;
            }
            const l = (mx + mn) / 2;
            const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
            return { h, s, l };
        }
        function hslToHex(h, s, l) {
            const f = n => {
                const k = (n + h / 30) % 12;
                const a = s * Math.min(l, 1 - l);
                const v = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
                return Math.round(255 * v).toString(16).padStart(2, "0");
            };
            return (f(0) + f(8) + f(4)).toUpperCase();  // no "#" — caller adds it
        }
        // recolor a family of shades toward the target hue, keeping each
        // shade's original lightness offset so gradients/shading survive
        function familyRecolor(family, target) {
            const ls = family.map(h => hexToHsl(h).l);
            const avg = ls.reduce((a, b) => a + b, 0) / family.length;
            const t = hexToHsl(target);
            const map = {};
            family.forEach((h, i) => {
                const l = Math.min(0.97, Math.max(0.03, t.l + ls[i] - avg));
                map[h] = hslToHex(t.h, t.s, l);
            });
            return map;
        }
        function recolorArt(entry) {
            let s = entry.art;
            entry.defaults.forEach((_, fi) => {
                const family = entry.fam["c" + (fi + 1)];
                const target = maskCfg.colors[fi];
                if (!family || !target) return;
                const map = familyRecolor(family, target);
                // tokenize first so one family's new color can never be
                // re-replaced by another family's pass
                family.forEach((h, i) => { s = s.split("#" + h).join("\x01" + fi + "_" + i + "\x02"); });
                family.forEach((h, i) => { s = s.split("\x01" + fi + "_" + i + "\x02").join("#" + map[h]); });
            });
            return s;
        }
        function maskSVG(entry, px, usePlayerColors) {
            const uid = "g" + (++svgId);
            let art = (usePlayerColors ? recolorArt(entry) : entry.art).split("SVGID_").join(uid + "SVGID_");
            const h = Math.round(px * entry.h / entry.w);
            return art.replace(/<svg /, `<svg width="${px}" height="${h}" `);
        }
        function refreshDesigner() {
            const entry = MASK_ART[maskCfg.mask];
            const row = document.getElementById("maskRow");
            row.innerHTML = "";
            MASK_ART.forEach((m, s) => {
                const holder = document.createElement("div");
                holder.className = "mask-option" + (maskCfg.mask === s ? " selected" : "");
                holder.title = m.name;
                holder.innerHTML = maskSVG(m, 36, false);
                holder.onclick = () => {
                    // switching masks adopts that mask's natural colors
                    maskCfg.mask = s;
                    maskCfg.colors = MASK_ART[s].defaults.slice();
                    refreshDesigner();
                };
                row.appendChild(holder);
            });
            document.getElementById("maskPreview").innerHTML = maskSVG(entry, 128, true);
            COLOR_LABELS.forEach((_, i) => {
                document.getElementById("sw-c" + (i + 1)).style.background = maskCfg.colors[i];
            });
        }
        function openPalette(targetIndex) {
            paletteTarget = targetIndex;
            const pal = document.getElementById("palette");
            pal.innerHTML = "";
            PALETTE.forEach(c => {
                const d = document.createElement("div");
                d.style.background = c;
                d.onclick = (e) => {
                    e.stopPropagation();
                    maskCfg.colors[paletteTarget] = c;
                    pal.style.display = "none";
                    refreshDesigner();
                };
                pal.appendChild(d);
            });
            pal.style.display = "grid";
        }
        document.addEventListener("click", (e) => {
            const pal = document.getElementById("palette");
            if (pal.style.display === "grid" && !pal.contains(e.target) && !e.target.classList.contains("swatch")) {
                pal.style.display = "none";
            }
        });
        // restore this player's last design and nickname (older saves used
        // {mask, base, accent} — carry the two colors we still have slots for)
        try {
            const saved = JSON.parse(localStorage.getItem("luchador") || "null");
            const idx = saved ? (saved.mask ?? saved.shape) : null;
            if (saved && typeof idx === "number" && MASK_ART[idx % MASK_ART.length]) {
                const entry = MASK_ART[idx % MASK_ART.length];
                maskCfg.mask = idx % MASK_ART.length;
                maskCfg.colors = entry.defaults.slice();
                if (saved.colors && Array.isArray(saved.colors) && saved.colors.length === 4) {
                    maskCfg.colors = saved.colors;
                } else if (saved.base) {
                    maskCfg.colors[0] = saved.base;
                    if (saved.accent) maskCfg.colors[1] = saved.accent;
                }
            }
            const savedName = localStorage.getItem("luchador_name");
            if (savedName) document.getElementById("nameInput").value = savedName;
        } catch (e) {}
        refreshDesigner();

        // rasterize the designed mask so the host lobby shows the EXACT mask
        function maskToPngDataURL() {
            const entry = MASK_ART[maskCfg.mask];
            const svg = maskSVG(entry, 400, true);
            return new Promise((resolve) => {
                const img = new Image();
                const blob = new Blob([svg], { type: "image/svg+xml" });
                const url = URL.createObjectURL(blob);
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    canvas.width = 400;
                    canvas.height = Math.round(400 * entry.h / entry.w);
                    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    try { resolve(canvas.toDataURL("image/png")); } catch (e) { resolve(""); }
                };
                img.onerror = () => { URL.revokeObjectURL(url); resolve(""); };
                img.src = url;
            });
        }

        // ── language: EN / Latin American Spanish ──
        // The host announces its language via LANG messages; a player who
        // taps the toggle overrides it for their own phone only.
        let LANG = localStorage.getItem("lang") || "en";
        let LANG_MANUAL = false;
        const STR = {
            en: {
                join_game: "JOIN THE GAME", nickname: "YOUR NICKNAME", join: "JOIN",
                connecting: "CONNECTING...", design: "DESIGN YOUR LUCHADOR",
                select_mask: "SELECT MASK", base: "BASE COLOR", accent: "ACCENT {0}",
                pick: "Pick your template!", write: "Write your best joke!",
                top: "TOP TEXT", bottom: "BOTTOM TEXT", finish: "FINISH",
                playing: "Playing as: {0}", waiting_host: "Waiting for Host...",
                submitted: "Submitted! Waiting for clock...",
                time_left: "\u23F3 Time Left: {0}s", times_up: "\u23F3 Time's up! Waiting for server...",
                vote_title: "Vote for the best meme!", vote_for: "Vote for {0}",
                vote_locked: "Vote locked in!", tie: "IT'S A TIE!",
                winner_prefix: "WINNER: ", points: "+{0} Points!",
                round_over: "Round over! Tallying scores...",
                ultimate: "\uD83C\uDFC6 ULTIMATE WINNER: {0} \uD83C\uDFC6",
                you_second: "\u26A1 YOU have to make a SECOND meme! Pick a template:",
                other_second: "\u23F3 {0} has to make a second meme..."
            },
            es: {
                join_game: "\u00DANETE AL JUEGO", nickname: "TU APODO", join: "UNIRME",
                connecting: "CONECTANDO...", design: "DISE\u00D1A TU LUCHADOR",
                select_mask: "ELIGE TU M\u00C1SCARA", base: "COLOR BASE", accent: "ACENTO {0}",
                pick: "\u00A1Elige tu plantilla!", write: "\u00A1Escribe tu mejor broma!",
                top: "TEXTO DE ARRIBA", bottom: "TEXTO DE ABAJO", finish: "LISTO",
                playing: "Jugando como: {0}", waiting_host: "Esperando al anfitri\u00F3n...",
                submitted: "\u00A1Enviado! Esperando el reloj...",
                time_left: "\u23F3 Tiempo: {0}s", times_up: "\u23F3 \u00A1Se acab\u00F3! Esperando...",
                vote_title: "\u00A1Vota por el mejor meme!", vote_for: "Vota por {0}",
                vote_locked: "\u00A1Voto enviado!", tie: "\u00A1EMPATE!",
                winner_prefix: "GANADOR: ", points: "\u00A1+{0} Puntos!",
                round_over: "Termin\u00F3 la ronda. Contando puntos...",
                ultimate: "\uD83C\uDFC6 GANADOR ABSOLUTO: {0} \uD83C\uDFC6",
                you_second: "\u26A1 \u00A1T\u00DA tienes que hacer un SEGUNDO meme! Elige una plantilla:",
                other_second: "\u23F3 {0} tiene que hacer un segundo meme..."
            }
        };
        function T(key) {
            let v = (STR[LANG] && STR[LANG][key] !== undefined) ? STR[LANG][key] : STR.en[key];
            for (let i = 1; i < arguments.length; i++) {
                v = v.split("{" + (i - 1) + "}").join(arguments[i]);
            }
            return v;
        }
        function toggleLang() {
            LANG = LANG === "en" ? "es" : "en";
            LANG_MANUAL = true;
            localStorage.setItem("lang", LANG);
            applyLang();
        }
        function applyLang() {
            document.getElementById("langBtn").textContent = LANG === "en" ? "EN" : "ES";
            document.getElementById("joinTitle").textContent = T("join_game");
            document.getElementById("nameInput").placeholder = T("nickname");
            document.getElementById("connectBtn").innerText = T("join");
            document.getElementById("designTitle").textContent = T("design");
            document.getElementById("selectMaskTitle").textContent = T("select_mask");
            document.getElementById("lblBase").textContent = T("base");
            for (let i = 1; i <= 3; i++) document.getElementById("lblAcc" + i).textContent = T("accent", i);
            document.getElementById("pickTitle").textContent = T("pick");
            document.getElementById("writeTitle").textContent = T("write");
            document.getElementById("topTextInput").placeholder = T("top");
            document.getElementById("bottomTextInput").placeholder = T("bottom");
            document.getElementById("finishBtn").innerText = T("finish");
            const wm = document.getElementById("waitingMessage");
            if (wm.innerText.indexOf("Waiting for Host") === 0 || wm.innerText.indexOf("Esperando al anfitri") === 0) {
                wm.innerText = T("waiting_host");
            }
        }
        applyLang();

        function startLocalTimer(seconds) {
            clearInterval(localTimer);
            let time = seconds;
            let display = document.getElementById("waitingMessage");
            display.style.display = "block";
            
            localTimer = setInterval(() => {
                if (time <= 0) {
                    clearInterval(localTimer);
                    display.innerText = T("times_up");
                } else {
                    display.innerText = T("time_left", time);
                    time--;
                }
            }, 1000);
        }

        function connectToServer() {
            playerName = document.getElementById("nameInput").value.trim().replace(/,/g, "") || ("Player" + Math.floor(Math.random()*1000));
            document.getElementById("connectBtn").innerText = T("connecting");
            socket = new WebSocket(SERVER_URL);

            socket.onopen = async () => {
                document.getElementById("setupScreen").style.display = "none";
                document.getElementById("gameScreen").style.display = "block";
                document.getElementById("playerNameDisplay").innerHTML = maskSVG(MASK_ART[maskCfg.mask], 30, true);
                document.getElementById("playerNameDisplay").appendChild(document.createTextNode(T("playing", playerName)));
                // Send the mask design + a small PNG snapshot of the EXACT
                // designed mask, so the host lobby shows the real artwork
                const png = await maskToPngDataURL();
                socket.send(["JOIN", playerName, maskCfg.mask, ...maskCfg.colors, png].join(","));
                try {
                    localStorage.setItem("luchador", JSON.stringify(maskCfg));
                    localStorage.setItem("luchador_name", playerName);
                } catch (e) {}
            };

            socket.onmessage = async (event) => {
                let message = event.data instanceof Blob ? await event.data.text() : event.data;
                let parts = message.split(",");
                let command = parts[0];

                if (command === "NEW_ROUND") {
                    let seconds = parseInt(parts[1]);
                    if (window.__revealTimer) { clearInterval(window.__revealTimer); window.__revealTimer = null; }
                    document.getElementById("topTextInput").value = "";
                    document.getElementById("bottomTextInput").value = "";
                    selectedImage = "";
                    mySubmitted = false;
                    document.getElementById("notice").style.display = "none";
                    
                    document.getElementById("matchWinnerScreen").style.display = "none";
                    document.getElementById("captionScreen").style.display = "none";
                    document.getElementById("voteScreen").style.display = "none";

                    showRandomTemplates(3);
                    document.getElementById("imageScreen").style.display = "block";
                    startLocalTimer(seconds);
                }

                if (command === "VOTE_TIME") {
                    let seconds = parseInt(parts[1]);
                    // Format: VOTE_TIME,seconds,count, then per meme: name,top,bottom,img
                    let count = parseInt(parts[2]);
                    const colors = ["#ef233c", "#3a86ff", "#ffbe0b"];

                    document.getElementById("captionScreen").style.display = "none";
                    document.getElementById("imageScreen").style.display = "none";

                    let voteScreen = document.getElementById("voteScreen");
                    voteScreen.style.display = "block";

                    currentMatchup = [];
                    voteScreen.innerHTML = "<h3>" + T("vote_title") + "</h3>";
                    for (let k = 0; k < count; k++) {
                        let base = 3 + k * 4;
                        let name = parts[base], top = parts[base + 1], bottom = parts[base + 2], img = parts[base + 3];
                        currentMatchup.push(name);
                        if (k > 0) voteScreen.appendChild(document.createElement("br"));
                        voteScreen.appendChild(makeMemeCard(img, top, bottom, name));
                        let voteRow = document.createElement("div");
                        voteRow.className = "vote-row";
                        voteRow.appendChild(maskAvatar(name));
                        voteRow.appendChild(makeVoteButton(name, colors[k % colors.length], k));
                        voteScreen.appendChild(voteRow);
                    }
                    startLocalTimer(seconds);
                }

                if (command === "LANG") {
                    // host language announcement — follow it unless this
                    // player tapped their own EN/ES toggle
                    if (!LANG_MANUAL) {
                        LANG = parts[1] === "es" ? "es" : "en";
                        applyLang();
                    }
                }

                if (command === "SECOND_MEME") {
                    // SECOND_MEME,seconds,name — the named player must make a
                    // second meme; everyone else just waits for them
                    let seconds = parseInt(parts[1]);
                    let who = parts[2];
                    document.getElementById("voteScreen").style.display = "none";
                    document.getElementById("matchWinnerScreen").style.display = "none";
                    let notice = document.getElementById("notice");
                    notice.style.display = "block";
                    if (who === playerName) {
                        // back to the picker for a SECOND meme
                        mySubmitted = false;
                        selectedImage = "";
                        document.getElementById("topTextInput").value = "";
                        document.getElementById("bottomTextInput").value = "";
                        notice.innerText = T("you_second");
                        showRandomTemplates(3);
                        document.getElementById("imageScreen").style.display = "block";
                    } else {
                        // everyone else keeps their picker/caption screen —
                        // they still need to make their OWN first meme!
                        if (!mySubmitted
                            && document.getElementById("imageScreen").style.display !== "block"
                            && document.getElementById("captionScreen").style.display !== "block"
                            && document.getElementById("voteScreen").style.display !== "block") {
                            document.getElementById("imageScreen").style.display = "block";
                            showRandomTemplates(3);
                        }
                        notice.innerText = T("other_second", who);
                    }
                    startLocalTimer(seconds);
                }

                if (command === "MASKOF") {
                    // MASKOF,name,data:image/png;base64,PAYLOAD — the payload
                    // itself contains commas, so rejoin everything after the name
                    let maskOwner = parts[1];
                    let png = parts.slice(2).join(",");
                    maskByName[maskOwner] = png;
                    // fill in avatars on screens that were already rendered
                    document.querySelectorAll(`img[data-maskfor="${CSS.escape(maskOwner)}"]`)
                        .forEach(el => { el.src = png; });
                }

                if (command === "MATCH_WINNER") {
                    clearInterval(localTimer);
                    // Godot now sends: Command, Winner, Img, Points, Top, Bot
                    let winner = parts[1], imgUrl = parts[2], points = parts[3], topT = parts[4], botT = parts[5];

                    document.getElementById("voteScreen").style.display = "none";
                    document.getElementById("waitingMessage").style.display = "none";

                    let winnerScreen = document.getElementById("matchWinnerScreen");
                    winnerScreen.style.display = "block";
                    winnerScreen.innerHTML = "";

                    if (winner === "TIE") {
                        winnerScreen.innerHTML = `<h2>${T("tie")}</h2>`;
                    } else {
                        let title = document.createElement("h2");
                        title.appendChild(maskAvatar(winner));
                        title.appendChild(document.createTextNode(T("winner_prefix") + winner));
                        let pointsLabel = document.createElement("h3");
                        pointsLabel.style.color = "yellow";
                        pointsLabel.textContent = T("points", points);
                        let card = makeMemeCard(imgUrl, topT, botT, winner);
                        card.querySelector("img").style.borderColor = "yellow";
                        winnerScreen.appendChild(title);
                        winnerScreen.appendChild(pointsLabel);
                        winnerScreen.appendChild(card);
                    }
                }

                if (command === "ROUND_SUMMARY") {
                    document.getElementById("matchWinnerScreen").style.display = "none";
                    document.getElementById("waitingMessage").innerText = T("round_over");
                    document.getElementById("waitingMessage").style.display = "block";
                }

                if (command === "GAME_OVER") {
                    clearInterval(localTimer);
                    if (window.__revealTimer) { clearInterval(window.__revealTimer); window.__revealTimer = null; }
                    document.getElementById("matchWinnerScreen").style.display = "none";
                    let overMsg = document.getElementById("waitingMessage");
                    overMsg.style.display = "block";
                    overMsg.innerText = "";
                    // the winner's mask beside the reveal
                    if (maskByName[parts[1]]) {
                        let overMask = maskAvatar(parts[1]);
                        overMask.style.width = "44px";
                        overMsg.appendChild(overMask);
                        overMsg.appendChild(document.createTextNode(" "));
                    }
                    // the name reveals letter by letter over 10 seconds
                    let revealSpan = document.createElement("span");
                    overMsg.appendChild(revealSpan);
                    let full = T("ultimate", parts[1]);
                    let shown = 0;
                    window.__revealTimer = setInterval(() => {
                        shown++;
                        revealSpan.textContent = full.slice(0, shown);
                        if (shown >= full.length) {
                            clearInterval(window.__revealTimer);
                            window.__revealTimer = null;
                        }
                    }, 10000 / full.length);
                }
            };
            socket.onclose = () => {
                // Go quietly back to the join screen (nickname is kept) instead
                // of an alert + reload loop when the host or tunnel is down.
                clearInterval(localTimer);
                document.getElementById("gameScreen").style.display = "none";
                document.getElementById("setupScreen").style.display = "block";
                document.getElementById("connectBtn").innerText = "JOIN";
            };
        }

        function pickImage(imgUrl) {
            selectedImage = imgUrl; 
            document.getElementById("imageScreen").style.display = "none";
            document.getElementById("captionScreen").style.display = "block";
            document.getElementById("captionImage").src = selectedImage; 
            socket.send("PICKED," + playerName + "," + imgUrl);
        }

        function submitMeme() {
            let t = document.getElementById("topTextInput").value.trim().replace(/,/g, "");
            let b = document.getElementById("bottomTextInput").value.trim().replace(/,/g, "");
            mySubmitted = true;
            socket.send("SUBMIT_MEME," + playerName + "," + t + "," + b + "," + selectedImage);
            document.getElementById("captionScreen").style.display = "none";
            document.getElementById("waitingMessage").innerText = T("submitted");
            document.getElementById("waitingMessage").style.display = "block";
        }

        function castVote(index) {
            socket.send("VOTE," + playerName + "," + currentMatchup[index]);
            document.getElementById("voteScreen").style.display = "none";
            document.getElementById("waitingMessage").innerText = T("vote_locked");
            document.getElementById("waitingMessage").style.display = "block";
        }

    </script>
</body>
</html>
